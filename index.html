<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gallery Gongbaek</title>
<meta name="description" content="여섯 점의 작품이 깊이를 따라 줄지어 서 있고, 마지막엔 관람객의 얼굴이 작품이 되는 온라인 전시.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Michroma&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--ink:#16191f;--mid:#737b86;--dim:#a4adb8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff}
body{font-family:Inter,'Noto Sans KR',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wide{font-family:Michroma,'Noto Sans KR',sans-serif;text-transform:uppercase}
.page{isolation:isolate;height:100svh;min-height:520px;display:grid;grid-template-rows:auto 1fr;background:#fff}
header{position:relative;z-index:5;background:#fff;padding:calc(20*var(--u)) calc(46*var(--u)) calc(15*var(--u))}
.r1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{font-size:calc(15.5*var(--u));letter-spacing:.2em}
.tabs{display:flex;gap:calc(48*var(--u));font-size:calc(14.5*var(--u));letter-spacing:.14em;color:var(--dim)}
.tabs a{transition:color .25s}.tabs a:hover,.tabs .on{color:var(--ink)}
.acct{justify-self:end;display:flex;gap:calc(22*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.12em}
.r2{display:flex;justify-content:center;gap:calc(60*var(--u));margin-top:calc(17*var(--u));font-size:calc(9.5*var(--u));letter-spacing:.14em}
.r2 a:hover{color:var(--mid)}
main{position:relative;display:grid;grid-template-columns:1fr calc(372*var(--u));min-height:0}
.stage{position:relative;overflow:hidden;min-width:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:none;
  background:linear-gradient(transparent 60%,rgba(255,255,255,.72) 100%),linear-gradient(90deg,#f1f5fa 0%,#e7eff6 38%,#eef4f9 62%,#f6f9fc 100%)}
.line{position:absolute;inset:0}
.m{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,filter}
.m svg{display:block;position:relative;width:100%;height:100%;box-shadow:0 2.5% 5% rgba(40,55,75,.14)}
.m:before{content:"";position:absolute;left:4%;right:4%;bottom:-3%;height:4%;border-radius:50%;background:radial-gradient(closest-side,rgba(70,85,105,.24),transparent)}
.intro{position:absolute;z-index:2;left:calc(46*var(--u));top:calc(36*var(--u));width:calc(390*var(--u));pointer-events:none}
.intro h2{font-weight:400;font-size:calc(22*var(--u));line-height:1.2;letter-spacing:.16em;white-space:nowrap}
.intro p{margin-top:calc(16*var(--u));font-size:calc(14*var(--u));line-height:1.62;color:var(--mid);word-break:keep-all}
.tag{position:absolute;z-index:2;left:calc(46*var(--u));bottom:calc(44*var(--u))}
.look{display:flex;font-size:calc(29*var(--u));line-height:calc(38*var(--u));letter-spacing:.14em;gap:.5em;pointer-events:none}
.win{height:calc(38*var(--u));overflow:hidden}
.roll{display:block;will-change:transform}
.roll b{display:block;font-weight:400;height:calc(38*var(--u))}
.go{margin-top:calc(16*var(--u));padding:calc(14*var(--u)) calc(26*var(--u));background:var(--ink);color:#fff;border-radius:99px;font-size:calc(13*var(--u));letter-spacing:.08em;transition:transform .2s,background .2s;cursor:pointer}
.go:hover{background:#000;transform:translateY(-2px)}
.ring{position:absolute;z-index:4;left:0;top:0;width:calc(46*var(--u));height:calc(46*var(--u));margin:calc(-23*var(--u)) 0 0 calc(-23*var(--u));border:calc(2.5*var(--u)) solid #16191f;border-radius:99px;pointer-events:none;opacity:0;transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1),margin .22s cubic-bezier(.2,.8,.2,1),opacity .2s}
.ring.show{opacity:1}
.ring.drag{width:calc(84*var(--u));height:calc(34*var(--u));margin:calc(-17*var(--u)) 0 0 calc(-42*var(--u))}
.rail{position:relative;overflow:hidden;background:#f3f6fa;min-height:0}
.card{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;padding:calc(22*var(--u)) calc(28*var(--u));will-change:transform;background:#f3f6fa}
.card.alt{background:#fff}
.shot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.shot svg{display:block;max-width:100%;max-height:100%;height:100%;width:auto}
.meta{margin-top:calc(12*var(--u))}
.meta h3{font-weight:400;font-size:calc(9.5*var(--u));letter-spacing:.14em}
.meta span{display:block;margin-top:calc(6*var(--u));font-size:calc(12*var(--u));color:var(--mid)}
.wait{position:fixed;inset:0;z-index:9;background:#f1f5fa;transition:opacity .5s;pointer-events:none}
.wait.gone{opacity:0}
/* 셀카 감상 모드 */
.cam{position:fixed;inset:0;z-index:20;background:#0d0f12;color:#fff;display:grid;place-items:center}
.cam[hidden]{display:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.frame{position:absolute;inset:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));border:10px solid var(--fc,#fff);pointer-events:none;mix-blend-mode:normal}
.label{position:absolute;left:28px;bottom:calc(32px + env(safe-area-inset-bottom));background:#fff;color:var(--ink);padding:12px 16px;font-size:12px;line-height:1.55;max-width:70%}
.label b{font-family:Michroma,'Noto Sans KR',sans-serif;font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block}
.close{position:absolute;right:28px;top:calc(28px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);font-size:20px}
.msg{position:relative;max-width:280px;text-align:center;font-size:14px;line-height:1.6;word-break:keep-all}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:14px 16px 12px}
  .r1{grid-template-columns:1fr auto}
  .tabs,.r2{display:none}
  .brand{font-size:14px}
  main{grid-template-columns:1fr;grid-template-rows:1fr 190px}
  .stage{cursor:auto}.ring{display:none}
  .intro{left:16px;top:18px;width:calc(100% - 32px)}
  .intro h2{font-size:17px}
  .intro p{display:none}
  .tag{left:16px;bottom:18px}
  .look{font-size:22px;line-height:30px}.win,.roll b{height:30px}
  .go{font-size:14px;padding:14px 22px}
  .card{width:160px;height:100%;padding:14px}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="r1">
      <a class="brand wide" href="#">Gallery Gongbaek</a>
      <nav class="tabs wide" aria-label="Sections"><a class="on" href="#" aria-current="page">Exhibition</a><a href="#">Artists</a><a href="#">Archive</a><a href="#">Visit</a></nav>
      <div class="acct wide"><span>Open 10—19</span></div>
    </div>
    <nav class="r2 wide" aria-label="Rooms"><a href="#">Painting</a><a href="#">Sculpture</a><a href="#">Media</a><a href="#">Performance</a><a href="#">Education</a></nav>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="전시 작품. 드래그, 스크롤 또는 방향키로 작품을 넘깁니다." tabindex="0">
      <div class="line" id="line"></div>
      <div class="intro">
        <h2 class="wide">Void &amp; Gaze 2026</h2>
        <p>보는 것과 보이는 것 사이. 여섯 점의 작품이 깊이를 따라 줄지어 서 있습니다. 드래그해 작품을 앞으로 불러오세요. 마지막 작품은 당신의 얼굴입니다.</p>
      </div>
      <div class="tag">
        <div class="look wide" aria-live="polite"><span>Work</span><span class="win"><span class="roll" id="roll"></span></span></div>
        <button class="go" id="go">미술작품 감상하기</button>
      </div>
      <div class="ring" id="ring"></div>
    </section>
    <aside class="rail" id="rail" aria-label="작품 정보"></aside>
  </main>
</div>
<div class="cam" id="cam" hidden role="dialog" aria-label="셀카 감상 모드">
  <p class="msg" id="msg">카메라를 여는 중…</p>
  <video id="vid" playsinline autoplay muted></video>
  <div class="frame" id="frame"></div>
  <div class="label" id="label"></div>
  <button class="close" id="close" aria-label="닫기">✕</button>
</div>
<div class="wait" id="wait"></div>
<script>
// 작품은 이미지 대신 인라인 SVG로 그림 (외부 이미지 의존 없음)
const grid=(()=>{let s='';for(let y=0;y<5;y++)for(let x=0;x<5;x++)s+=`<rect x="${50+x*82}" y="${50+y*82}" width="68" height="68" fill="${(x*7+y*3)%5?'#e4e2da':'#16191f'}"/>`;return s})();
const ARTS=[
  {t:'붉은 원',a:'김소연',m:'캔버스에 아크릴',y:2026,c:'#d2412f',w:400,h:500,s:'<rect width="400" height="500" fill="#efe9dd"/><circle cx="200" cy="225" r="120" fill="#d2412f"/><path d="M60 430H340" stroke="#16191f" stroke-width="2"/>'},
  {t:'푸른 수평선',a:'이준',m:'리넨에 유채',y:2025,c:'#2a56c6',w:400,h:500,s:'<rect width="400" height="500" fill="#1d3a86"/><rect width="400" height="290" fill="#2a56c6"/><rect y="290" width="400" height="34" fill="#e9b44c"/>'},
  {t:'스물다섯 개의 침묵',a:'박하린',m:'패널에 과슈',y:2026,c:'#16191f',w:500,h:500,s:'<rect width="500" height="500" fill="#f4f4f0"/>'+grid},
  {t:'획',a:'정우',m:'한지에 먹',y:2024,c:'#111',w:360,h:500,s:'<rect width="360" height="500" fill="#fbfaf6"/><path d="M70 110C150 90 250 140 290 210S120 330 110 400" fill="none" stroke="#111" stroke-width="22" stroke-linecap="round"/><circle cx="270" cy="420" r="9" fill="#c33"/>'},
  {t:'노란 삼각',a:'최은',m:'알루미늄에 에나멜',y:2025,c:'#f1c40f',w:500,h:400,s:'<rect width="500" height="400" fill="#121316"/><path d="M90 320L250 70 410 320Z" fill="#f1c40f"/><circle cx="330" cy="150" r="42" fill="#f4f4f0"/>'},
  {t:'숨',a:'한서',m:'캔버스에 에어브러시',y:2026,c:'#e8a6c8',w:400,h:500,s:'<defs><radialGradient id="g"><stop offset="0" stop-color="#ffe3ef"/><stop offset=".55" stop-color="#e8a6c8"/><stop offset="1" stop-color="#8fb3e8"/></radialGradient></defs><rect width="400" height="500" fill="#8fb3e8"/><circle cx="200" cy="250" r="170" fill="url(#g)"/>'}
];
// 깊이 정지점 d=-1..5 (작품은 사람보다 넓어서 높이를 줄임)
const KX=[1.2,.744,.496,.346,.235,.15,.085],KF=[1.06,.8,.71,.655,.615,.588,.568],KH=[.92,.6,.43,.33,.255,.2,.15],
      KB=[0,0,1.5,4,8,12,17],KO=[1,1,1,1,.86,.5,0];
const N=ARTS.length,$=id=>document.getElementById(id),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const stage=$('stage'),rail=$('rail'),ring=$('ring'),roll=$('roll'),line=$('line');
const wrap=(x,n)=>((x%n)+n)%n,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const art=(A,id)=>`<svg viewBox="0 0 ${A.w} ${A.h}" aria-hidden="true">${A.s.replaceAll('id="g"',`id="${id}"`).replaceAll('url(#g)',`url(#${id})`)}</svg>`;

const works=ARTS.map((A,i)=>{
  const e=document.createElement('div');e.className='m';e.dataset.i=i;e.innerHTML=art(A,'gm'+i);line.append(e);
  return{e,r:A.w/A.h,f:'',o:''};
});
const cards=ARTS.map((A,i)=>{
  const e=document.createElement('article');e.className='card'+(i%2?' alt':'');
  e.innerHTML=`<span class="shot">${art(A,'gc'+i)}</span><div class="meta"><h3 class="wide">${A.t}</h3><span>${A.a} · ${A.m}, ${A.y}</span></div>`;
  rail.append(e);return e;
});
for(let i=0;i<=N;i++){const b=document.createElement('b');b.textContent=String(1+i%N).padStart(2,'0');roll.append(b)}

let W=0,H=0,S=0,base=0,cardS=0,side=false,dirty=true,p=0,target=0,last=0;
function size(){
  W=stage.clientWidth;H=stage.clientHeight;side=innerWidth<=820;S=side?Math.min(H,W*1.05):H;base=S*1.2; // 좁은 폰에선 앞 작품이 화면 밖으로 안 나가게 크기를 폭에 맞춤
  works.forEach(m=>{m.e.style.width=base*m.r+'px';m.e.style.height=base+'px'});
  cardS=side?160:rail.clientHeight/3;
  cards.forEach(c=>c.style.height=side?'100%':cardS+'px');
  dirty=true;
}
addEventListener('resize',size);

function paint(){
  works.forEach((m,i)=>{
    let d=wrap(i-p,N);if(d>N-1)d-=N;
    const k=clamp(d+1,0,6),a=Math.floor(k),b=Math.min(6,a+1),t=k-a,mix=A=>A[a]+(A[b]-A[a])*t;
    const h=mix(KH)*S,s=h/base,w=h*m.r,x=mix(KX)*W-w/2,y=mix(KF)*H-h;
    m.e.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${s.toFixed(4)})`;
    const f=mix(KB)/s,fs=f<.2?'none':`blur(${f.toFixed(1)}px)`,o=mix(KO).toFixed(3);
    if(fs!==m.f){m.f=fs;m.e.style.filter=fs}
    if(o!==m.o){m.o=o;m.e.style.opacity=o}
    m.e.style.zIndex=100-Math.round(d*10);
  });
  const all=cardS*N;
  cards.forEach((c,i)=>{
    let y=wrap(i*cardS-p*cardS,all);if(y>all-cardS)y-=all;
    c.style.transform=side?`translate3d(${y.toFixed(1)}px,0,0)`:`translate3d(0,${y.toFixed(1)}px,0)`;
  });
  roll.style.transform=`translate3d(0,${(-wrap(p,N)*roll.firstChild.offsetHeight).toFixed(1)}px,0)`;
}

let mx=0,my=0,cx=0,cy=0,down=false,sx=0,st=0,moved=0,wheelT=0;
function frame(now){
  const dt=Math.min(50,now-last)||16;last=now;
  const was=p;
  if(calm)p=target;else p+=(target-p)*(1-Math.exp(-dt*.0072));
  if(Math.abs(target-p)<.0004)p=target;
  if(p!==was||dirty){dirty=false;paint()}
  cx+=(mx-cx)*.32;cy+=(my-cy)*.32;
  ring.style.transform=`translate3d(${cx.toFixed(1)}px,${cy.toFixed(1)}px,0)`;
}
const PULL=()=>Math.max(150,W*.2);
stage.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')ring.classList.add('show')});
stage.addEventListener('pointerleave',()=>ring.classList.remove('show'));
stage.addEventListener('pointermove',e=>{
  const r=stage.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
  if(!down)return;
  const dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));target=st+dx/PULL();
});
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('a,button'))return;
  down=true;sx=e.clientX;st=target;moved=0;stage.setPointerCapture(e.pointerId);ring.classList.add('drag');
});
function release(e){
  if(!down)return;down=false;ring.classList.remove('drag');
  if(moved<6){
    const hit=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('m'));
    if(hit){let d=Math.round(wrap(+hit.dataset.i-target,N));if(d>0&&d<N)target=Math.round(target)+d}
  }else target=Math.round(target);
}
stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
stage.addEventListener('wheel',e=>{
  e.preventDefault();target+=clamp(e.deltaY+e.deltaX,-120,120)/420;
  clearTimeout(wheelT);wheelT=setTimeout(()=>{target=Math.round(target)},150);
},{passive:false});
addEventListener('keydown',e=>{
  if(!$('cam').hidden){if(e.key==='Escape')closeCam();return}
  if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();target=Math.round(target)+1}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();target=Math.round(target)-1}
});

// 셀카 감상: 전면 카메라를 켜고, 지금 맨 앞 작품의 색으로 액자를 두름
let stream=null;
async function openCam(){
  const A=ARTS[wrap(Math.round(target),N)];
  $('cam').hidden=false;$('msg').textContent='카메라를 여는 중…';
  $('frame').style.setProperty('--fc',A.c);
  $('label').innerHTML=`<b>무제 (당신), ${new Date().getFullYear()}</b>관람객 · 실시간 영상<br>「${A.t}」 앞에서`;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    $('vid').srcObject=stream;$('msg').textContent='';
  }catch(err){
    $('msg').textContent=!isSecureContext?'카메라는 https:// 주소에서만 켜집니다.':'카메라 권한을 허용한 뒤 다시 눌러 주세요.';
  }
}
function closeCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  $('vid').srcObject=null;$('cam').hidden=true;$('go').focus();
}
$('go').addEventListener('click',openCam);
$('close').addEventListener('click',closeCam);

function loop(t){frame(t);requestAnimationFrame(loop)}
document.fonts.ready.then(()=>{size();paint();$('wait').classList.add('gone')});
size();requestAnimationFrame(loop);
</script>
</body>
</html>
